<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QueueWise Clinic</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><h1>QueueWise</h1><nav><a href="/">Book a visit</a><a href="/admin.html">Staff panel</a></nav></header>
<main><section class="card"><h2>Book an Appointment</h2><form id="booking-form"><label>Doctor<select id="doctorId" required></select></label><label>Patient name<input id="patientName" required></label><label>Phone<input id="phone" required></label><label>Reason<input id="reason" placeholder="General consultation"></label><button id="submit-btn">Get my ticket</button><p id="form-msg"></p></form><div id="ticket-card" class="ticket"><h2>Your Ticket: <span id="ticket-number">—</span></h2><strong id="ticket-status"></strong><p id="ticket-meta"></p></div></section>
<section class="card"><h2>Live Queue Board</h2><p id="board-doctor-name">Select a doctor above</p><div class="board"><div><small>NOW SERVING</small><b id="board-now-serving">—</b><span id="board-now-serving-caption">No active consultation</span></div><div><small>WAITING</small><b id="board-waiting-count">0</b></div><div><small>EST. WAIT</small><b id="board-est-wait">0m</b></div></div><ul id="board-waiting-list"></ul></section></main><script src="js/patient.js"></script></body></html>
